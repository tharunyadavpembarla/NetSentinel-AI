<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NetSentinel AI Dashboard</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

<h1>🛡 NetSentinel AI</h1>
<h2>Live Network Monitoring Dashboard</h2>

<div class="cards">

<div class="card">
<h3>Total Packets</h3>
<p id="totalPackets">0</p>
</div>

<div class="card">
<h3>TCP</h3>
<p id="tcpCount">0</p>
</div>

<div class="card">
<h3>UDP</h3>
<p id="udpCount">0</p>
</div>

<div class="card">
<h3>ICMP</h3>
<p id="icmpCount">0</p>
</div>

</div>

<table id="packetTable">

<thead>

<tr>

<th>ID</th>

<th>Source IP</th>

<th>Destination IP</th>

<th>Protocol</th>

<th>Source Port</th>

<th>Destination Port</th>

<th>Alert</th>

<th>Attak Type</th>

</tr>

</thead>

<tbody id="packetTableBody">

</tbody>

</table>

</div>

<script src="app.js"></script>

</body>
</html>
